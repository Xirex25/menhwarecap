  <style>body{font-family:Inter,sans-serif}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:#0f172a}::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}input[type="range"]{-webkit-appearance:none;width:100%;height:5px;border-radius:5px;background:#334155;outline:0}input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:#6366f1;cursor:pointer}input[type="range"]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#6366f1;cursor:pointer;border:none}.ratio:hover{background-color:#334155;color:#e2e8f0}.audio-item.dragging{opacity:0.5;background-color:#1e293b}.audio-item.drag-over{border-top:2px solid #6366f1}#canvasWrapper{border:2px dashed #334155}</style>

  <div class="flex items-center gap-3 flex-wrap"><div class="flex bg-slate-800 p-1 rounded-lg border border-slate-700"><button id="ratio169" onclick="setAspectRatio('16:9')" class="ratio px-3 py-1.5 rounded-md text-xs font-semibold text-slate-100 bg-indigo-600">16:9</button><button id="ratio916" onclick="setAspectRatio('9:16')" class="ratio px-3 py-1.5 rounded-md text-xs text-slate-400">9:16</button><button id="ratio11" onclick="setAspectRatio('1:1')" class="ratio px-3 py-1.5 rounded-md text-xs text-slate-400">1:1</button></div><button onclick="document.getElementById('audioMultiInput').click()" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-xs font-semibold flex items-center gap-1"><i class="fa-solid fa-music"></i>Audio</button><button onclick="document.getElementById('photosInput').click()" class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-xs font-semibold flex items-center gap-1"><i class="fa-solid fa-image"></i>Foto</button></div>

<section class="lg:col-span-7 space-y-4"><div class="bg-slate-900 border border-slate-800 rounded-2xl p-4"><div id="canvasWrapper" class="relative h-[min(55vw,440px)] min-h-[280px] bg-slate-950 rounded-xl overflow-hidden" ondrop="handleCanvasDrop(event)" ondragover="event.preventDefault()" ondragenter="this.style.borderColor='#6366f1'" ondragleave="this.style.borderColor='#475569'"><canvas id="videoCanvas" class="w-full h-full block"></canvas><div id="emptyCanvasNotice" style="display:flex" class="absolute inset-0 flex-col items-center justify-center gap-3 bg-slate-950/50"><i class="fa-solid fa-image text-3xl text-slate-600"></i><p class="text-sm text-slate-400">Paste foto atau klik upload</p></div></div></div><div class="bg-slate-900 border border-slate-800 rounded-2xl p-4"><div class="space-y-3"><div class="flex justify-between items-center text-sm"><span>Timeline</span><span id="currentTimeDisplay" class="font-mono text-indigo-400">00:00</span></div><div id="timelineMarkersTrack" class="relative h-12 bg-slate-800 rounded-lg overflow-hidden p-2"><div id="timelineVisualiser" class="flex items-end gap-1 h-full opacity-40"></div></div><div class="flex items-center gap-2"><input type="range" id="seekSlider" onchange="onSeekInput(this.value)" oninput="onSeekInput(this.value)" value="0" class="flex-1"><span id="durationTimeDisplay" class="font-mono text-sm text-slate-400 min-w-[40px]">00:00</span></div><div class="flex gap-2"><button onclick="togglePlay()" class="flex-1 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-lg font-semibold flex items-center justify-center gap-2"><i id="playIcon" class="fa-solid fa-play"></i>Putar</button><button onclick="stopPlayback()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg"><i class="fa-solid fa-stop"></i></button></div></div></div></section>
<section class="lg:col-span-5 space-y-4"><div class="bg-slate-900 border border-slate-800 rounded-2xl p-5"><div class="flex justify-between border-b border-slate-800 pb-3"><div><h2 class="font-semibold">Audio <span id="audioCountBadge" class="ml-1 px-2 py-0.5 text-xs rounded-full bg-emerald-600/20 text-emerald-300">0 Lagu</span></h2><p class="text-xs text-slate-400">Durasi: <span id="totalAudioDurationDisplay" class="font-mono">00:00</span></p></div><button onclick="document.getElementById('audioMultiInput').click()" class="text-emerald-400 hover:text-emerald-300"><i class="fa-solid fa-plus"></i></button></div><div id="audioMergeStatus" class="hidden mt-3 p-3 bg-slate-800 rounded"><p id="audioMergeStatusText" class="text-xs text-slate-400 mb-2">Memproses...</p><div class="w-full h-2 bg-slate-700 rounded-full overflow-hidden"><div id="audioMergeProgress" style="width:0%" class="h-full bg-emerald-500 transition-all"></div></div></div><div id="audioPlaylist" class="mt-3 space-y-1 max-h-40 overflow-y-auto"></div></div><div class="bg-slate-900 border border-slate-800 rounded-2xl p-5"><div class="flex justify-between border-b border-slate-800 pb-3"><div><h2 class="font-semibold">Foto <span id="photoCountBadge" class="ml-1 px-2 py-0.5 text-xs rounded-full bg-blue-600/20 text-blue-300">0 Foto</span></h2><p class="text-xs text-slate-400">Durasi per foto: <strong>3 detik</strong></p></div><button onclick="document.getElementById('photosInput').click()" class="text-blue-400 hover:text-blue-300"><i class="fa-solid fa-plus"></i></button></div><div id="photosList" class="mt-3 space-y-2 max-h-64 overflow-y-auto"></div></div><button onclick="startVideoGeneration()" class="w-full mt-4 px-4 py-3 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 rounded-lg font-bold flex items-center justify-center gap-2"><i class="fa-solid fa-download"></i>Export Video</button></section>
</main>
<div id="exportModal" class="fixed inset-0 hidden items-center justify-center bg-black/80 z-50 p-4"><div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-md w-full"><div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">Mengekspor Video</h3><button onclick="closeExportModal()" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-times"></i></button></div><div class="space-y-3"><p id="exportStatusText" class="text-center font-mono text-2xl font-bold text-indigo-400">0%</p><div class="w-full h-3 bg-slate-800 rounded-full overflow-hidden"><div id="exportProgress" style="width:0%" class="h-full bg-gradient-to-r from-indigo-600 to-violet-600 transition-all"></div></div><p class="text-xs text-slate-400 text-center">Jangan tutup tab ini...</p></div></div></div>
<input type="file" id="audioMultiInput" accept="audio/*" multiple class="hidden">
<input type="file" id="photosInput" accept="image/*" multiple class="hidden">
<canvas id="blurCanvas" class="hidden"></canvas>
<audio id="audioPlayer" class="hidden" crossorigin="anonymous"></audio>
<script>
'use strict';
const $=id=>document.getElementById(id);
const audioElement=$('audioPlayer'),canvas=$('videoCanvas'),ctx=canvas.getContext('2d');
const blurCanvas=$('blurCanvas'),blurCtx=blurCanvas.getContext('2d');
let audioTracks=[],photos=[],selectedPhotoId=null,totalAudioDuration=0,isPlaying=false,isMergingAudio=false,aspect='16:9',audioCtx=null;
let draggedAudioIndex=-1;

const PHOTO_DURATION=3;const PHOTO_DURATION_MIN=2;const PHOTO_DURATION_MAX=5;

const formatTime=s=>{s=Number(s)||0;return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')};

function setAspectRatio(r){
  aspect=r;
  document.querySelectorAll('.ratio').forEach(b=>b.className='ratio px-3 py-1.5 rounded-md text-xs text-slate-400');
  $('ratio'+({'16:9':'169','9:16':'916','1:1':'11'}[r])).className='ratio px-3 py-1.5 rounded-md text-xs font-semibold text-slate-100 bg-indigo-600';
  updateCanvasDimensions();
}

function updateCanvasDimensions(){
  const[w,h]=aspect.split(':').map(Number),max=960;
  canvas.width=w>h?max:Math.round(max*w/h);
  canvas.height=w>h?Math.round(max*h/w):max;
  blurCanvas.width=canvas.width;
  blurCanvas.height=canvas.height;
  renderCanvasFrame(audioElement.currentTime||0);
}

function updatePlaybackUI(){
  const t=audioElement.currentTime||0;
  $('currentTimeDisplay').textContent=formatTime(t);
  $('durationTimeDisplay').textContent=formatTime(totalAudioDuration);
  $('seekSlider').max=Math.max(100,totalAudioDuration||100);
  $('seekSlider').value=t;
}

function togglePlay(){
  if(!audioElement.src||isMergingAudio)return;
  audioElement.paused?audioElement.play().catch(e=>console.warn(e)):audioElement.pause();
}

function stopPlayback(){
  audioElement.pause();
  audioElement.currentTime=0;
  renderCanvasFrame(0);
  updatePlaybackUI();
}

audioElement.onplay=()=>{
  isPlaying=true;
  $('playIcon').className='fa-solid fa-pause';
  requestAnimationFrame(playbackLoop);
};
audioElement.onpause=()=>{
  isPlaying=false;
  $('playIcon').className='fa-solid fa-play';
};
audioElement.ontimeupdate=updatePlaybackUI;

function onSeekInput(v){
  audioElement.currentTime=Number(v);
  renderCanvasFrame(Number(v));
}

function playbackLoop(){
  if(isPlaying){
    renderCanvasFrame(audioElement.currentTime);
    requestAnimationFrame(playbackLoop);
  }
}

$('audioMultiInput').onchange=e=>handleMultiAudioUpload(e);
$('photosInput').onchange=e=>handlePhotosUpload(e);

async function handleMultiAudioUpload(e){
  const files=[...e.target.files];
  if(!files.length)return;
  
  audioTracks=[];
  isMergingAudio=true;
  $('audioMergeStatus').classList.remove('hidden');
  $('audioMergeStatusText').textContent='Memuat audio...';
  $('audioMergeProgress').style.width='0%';
  
  try{
    let loadedCount=0;
    
    for(let i=0;i<files.length;i++){
      try{
        const file=files[i];
        const buffer=await decodeAudioFile(file);
        if(!buffer){
          console.warn('Skip:',file.name);
          continue;
        }
        
        audioTracks.push({name:file.name,buffer,duration:buffer.duration});
        loadedCount++;
        
        const progress=Math.round(loadedCount/files.length*100);
        $('audioMergeProgress').style.width=progress+'%';
        $('audioMergeStatusText').textContent=`Memuat ${loadedCount}/${files.length} file...`;
      }catch(err){
        console.error('Error loading '+files[i].name+':',err);
      }
    }
    
    if(!audioTracks.length)throw new Error('Tidak ada file audio yang berhasil dimuat');
    
    $('audioMergeStatusText').textContent='Menggabungkan audio...';
    await new Promise(r=>setTimeout(r,100));
    await mergeAudioTracks();
    
    $('audioMergeStatus').classList.add('hidden');
    renderAudioUI();
  }catch(err){
    console.error('❌ Audio error:',err);
    alert('Error: '+err.message);
    audioTracks=[];
    isMergingAudio=false;
    $('audioMergeStatus').classList.add('hidden');
    renderAudioUI();
  }
}

async function decodeAudioFile(file){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  
  try{
    const arrayBuffer=await file.arrayBuffer();
    if(!arrayBuffer||arrayBuffer.byteLength===0)throw new Error('File kosong');
    
    return await new Promise((resolve,reject)=>audioCtx.decodeAudioData(arrayBuffer,resolve,reject));
  }catch(e){
    return null;
  }
}

async function mergeAudioTracks(){
  if(!audioTracks.length)return;
  
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    
    const rate=audioCtx.sampleRate;
    const channels=Math.max(...audioTracks.map(t=>t.buffer.numberOfChannels));
    const total=audioTracks.reduce((n,t)=>n+t.buffer.length,0);
    const merged=audioCtx.createBuffer(channels,total,rate);
    
    let offset=0;
    for(let track of audioTracks){
      const trackChannels=track.buffer.numberOfChannels;
      const trackLength=track.buffer.length;
      
      for(let c=0;c<channels;c++){
        const sourceData=c<trackChannels?track.buffer.getChannelData(c):new Float32Array(trackLength);
        merged.getChannelData(c).set(sourceData,offset);
      }
      offset+=trackLength;
    }
    
    totalAudioDuration=total/rate;
    autoDistributePhotos();
    
    const wavData=audioBufferToWav(merged);
    const blob=new Blob([wavData],{type:'audio/wav'});
    audioElement.src=URL.createObjectURL(blob);
    updatePlaybackUI();
    isMergingAudio=false;
  }catch(err){
    console.error('Merge error:',err);
    throw err;
  }
}

function audioBufferToWav(audioBuffer){
  const rate=audioBuffer.sampleRate||44100;
  const channels=audioBuffer.numberOfChannels;
  const length=audioBuffer.length;
  const bytesPerSample=2;
  const frameSize=channels*bytesPerSample;
  const dataSize=length*frameSize;
  const bufferSize=44+dataSize;
  
  const buffer=new ArrayBuffer(bufferSize);
  const view=new DataView(buffer);
  
  const writeString=(offset,string)=>{
    for(let i=0;i<string.length;i++)view.setUint8(offset+i,string.charCodeAt(i));
  };
  
  try{
    writeString(0,'RIFF');
    view.setUint32(4,bufferSize-8,true);
    writeString(8,'WAVE');
    
    writeString(12,'fmt ');
    view.setUint32(16,16,true);
    view.setUint16(20,1,true);
    view.setUint16(22,channels,true);
    view.setUint32(24,rate,true);
    view.setUint32(28,rate*frameSize,true);
    view.setUint16(32,frameSize,true);
    view.setUint16(34,16,true);
    
    writeString(36,'data');
    view.setUint32(40,dataSize,true);
    
    const channelData=[];
    for(let c=0;c<channels;c++)channelData.push(audioBuffer.getChannelData(c));
    
    let sampleOffset=44;
    for(let i=0;i<length;i++){
      for(let c=0;c<channels;c++){
        const sample=Math.max(-1,Math.min(1,channelData[c][i]));
        const intSample=sample<0?sample*0x8000:sample*0x7fff;
        if(sampleOffset+1<bufferSize){
          view.setInt16(sampleOffset,intSample,true);
          sampleOffset+=2;
        }
      }
    }
    
    return buffer;
  }catch(err){
    console.error('WAV encoding error:',err);
    throw err;
  }
}

function renderAudioUI(){
  $('audioCountBadge').textContent=audioTracks.length+' Lagu';
  $('totalAudioDurationDisplay').textContent=formatTime(totalAudioDuration);
  $('audioPlaylist').innerHTML=audioTracks.map((t,i)=>`<div class="audio-item flex justify-between items-center p-2 bg-slate-800 rounded text-sm cursor-move hover:bg-slate-700 transition" draggable="true" ondragstart="dragStart(${i})" ondragover="dragOver(event)" ondrop="dropAudio(${i})" ondragend="dragEnd()"><span class="truncate flex-1">${escapeHtml(t.name)}</span><div class="flex items-center gap-1 flex-shrink-0"><span class="text-xs text-slate-400">${formatTime(t.duration)}</span><button onclick="removeAudio(${i})" class="text-red-400 hover:text-red-300 ml-1"><i class="fa-solid fa-trash"></i></button></div></div>`).join('');
  renderTimelineMarkers();
}

function dragStart(i){draggedAudioIndex=i;event.target.closest('.audio-item').classList.add('dragging')}
function dragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over')}
function dragEnd(){document.querySelectorAll('.audio-item').forEach(el=>el.classList.remove('drag-over','dragging'))}
function dropAudio(i){
  if(draggedAudioIndex!==i&&draggedAudioIndex>=0){
    [audioTracks[draggedAudioIndex],audioTracks[i]]=[audioTracks[i],audioTracks[draggedAudioIndex]];
    mergeAudioTracks().then(renderAudioUI);
  }
  dragEnd();
}

function removeAudio(i){
  audioTracks.splice(i,1);
  if(audioTracks.length)mergeAudioTracks().then(renderAudioUI);
  else{audioElement.removeAttribute('src');totalAudioDuration=0;renderAudioUI();updatePlaybackUI();selectedPhotoId=null;updatePhotosUI()}
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function handlePhotosUpload(e){
  for(const file of e.target.files){
    const url=URL.createObjectURL(file),img=new Image();
    await new Promise(res=>{img.onload=res;img.onerror=res;img.src=url});
    if(img.naturalWidth){
      photos.push({id:Date.now()+Math.random(),url,imgObj:img,startTime:0});
    }
  }
  autoDistributePhotos();
}

async function handleCanvasDrop(e){
  e.preventDefault();
  e.stopPropagation();
  
  const dt=e.dataTransfer;
  const items=dt.items||[];
  
  if(items.length){
    for(let i=0;i<items.length;i++){
      if(items[i].kind==='file'&&items[i].type.startsWith('image/')){
        const file=items[i].getAsFile();
        const url=URL.createObjectURL(file),img=new Image();
        await new Promise(res=>{img.onload=res;img.onerror=res;img.src=url});
        if(img.naturalWidth){
          photos.push({id:Date.now()+Math.random(),url,imgObj:img,startTime:0});
        }
      }
    }
  }else if(dt.files){
    for(let file of dt.files){
      if(file.type.startsWith('image/')){
        const url=URL.createObjectURL(file),img=new Image();
        await new Promise(res=>{img.onload=res;img.onerror=res;img.src=url});
        if(img.naturalWidth){
          photos.push({id:Date.now()+Math.random(),url,imgObj:img,startTime:0});
        }
      }
    }
  }
  
  if(photos.length)autoDistributePhotos();
}

document.addEventListener('paste',async e=>{
  const items=(e.clipboardData||e.originalEvent.clipboardData).items||[];
  for(let item of items){
    if(item.type.startsWith('image/')){
      const file=item.getAsFile();
      const url=URL.createObjectURL(file),img=new Image();
      await new Promise(res=>{img.onload=res;img.onerror=res;img.src=url});
      if(img.naturalWidth){
        photos.push({id:Date.now()+Math.random(),url,imgObj:img,startTime:0});
      }
    }
  }
  if(photos.length){
    autoDistributePhotos();
  }
});

function autoDistributePhotos(){
  if(!photos.length){updatePhotosUI();return}
  const interval=PHOTO_DURATION;
  photos.forEach((p,i)=>p.startTime=Number((i*interval).toFixed(1)));
  updatePhotosUI();
}

function updatePhotoTime(id,v){
  const p=photos.find(x=>x.id==id);
  if(p)p.startTime=Math.max(0,Number(v)||0);
  photos.sort((a,b)=>a.startTime-b.startTime);
  updatePhotosUI();
  renderCanvasFrame(audioElement.currentTime||0);
}

function deletePhoto(id){
  const p=photos.find(x=>x.id==id);
  if(p)URL.revokeObjectURL(p.url);
  photos=photos.filter(x=>x.id!=id);
  if(selectedPhotoId==id)selectedPhotoId=photos[0]?.id||null;
  updatePhotosUI();
  renderCanvasFrame(audioElement.currentTime||0);
}

function addPhotoAtCurrentTime(){
  if(!selectedPhotoId&&photos[0])selectedPhotoId=photos[0].id;
  if(selectedPhotoId)updatePhotoTime(selectedPhotoId,audioElement.currentTime)
}

function updatePhotosUI(){
  $('photoCountBadge').textContent=photos.length+' Foto';
  $('emptyCanvasNotice').style.display=photos.length?'none':'flex';
  $('photosList').innerHTML=photos.length?photos.map((p,i)=>`<div class="p-2 bg-slate-800 rounded"><div class="flex gap-2 mb-2"><div class="w-12 h-12 rounded bg-slate-700 overflow-hidden flex-shrink-0"><img src="${p.url}" class="w-full h-full object-cover"></div><div class="flex-1 min-w-0"><p class="text-xs font-semibold truncate">Foto ${i+1}</p><input type="number" value="${p.startTime}" min="0" max="${totalAudioDuration}" onchange="updatePhotoTime(${p.id},this.value)" class="w-full px-1 py-0.5 text-xs bg-slate-700 rounded text-slate-100 border border-slate-600"></div><button onclick="deletePhoto(${p.id})" class="text-red-400 hover:text-red-300 flex-shrink-0"><i class="fa-solid fa-trash-alt"></i></button></div></div>`).join(''):' ';
  renderTimelineMarkers();
  renderCanvasFrame(audioElement.currentTime||0);
}

function renderTimelineMarkers(){
  const t=$('timelineMarkersTrack');
  t.innerHTML='';
  photos.forEach(p=>{
    if(totalAudioDuration){
      const x=document.createElement('div');
      x.className='absolute top-0 bottom-0 w-1 bg-violet-500 opacity-70 group';
      x.style.left=(p.startTime/totalAudioDuration*100)+'%';
      x.title=formatTime(p.startTime);
      t.appendChild(x);
    }
  });
}

function generateVisualiserBars(){
  const el=$('timelineVisualiser');
  el.innerHTML=Array.from({length:45},()=>`<i class="flex-1 bg-indigo-500 rounded" style="height:${20+Math.random()*70}%"></i>`).join('');
}

function createBlurredBackground(img){
  blurCtx.clearRect(0,0,blurCanvas.width,blurCanvas.height);
  const ia=img.width/img.height,ca=blurCanvas.width/blurCanvas.height;
  const bgW=ia>ca?blurCanvas.height*ia:blurCanvas.width;
  const bgH=ia>ca?blurCanvas.height:blurCanvas.width/ia;
  const x=(blurCanvas.width-bgW)/2;
  const y=(blurCanvas.height-bgH)/2;
  
  blurCtx.drawImage(img,x,y,bgW,bgH);
  blurCtx.filter='blur(35px)';
  blurCtx.drawImage(blurCanvas,0,0);
  blurCtx.filter='none';
  
  return blurCanvas.getImageData(0,0,blurCanvas.width,blurCanvas.height);
}

function renderCanvasFrame(time){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!photos.length){
    ctx.fillStyle='#0f172a';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    return;
  }
  
  let i=photos.findLastIndex?photos.findLastIndex(p=>p.startTime<=time):-1;
  if(i<0)for(let n=photos.length-1;n>=0;n--)if(photos[n].startTime<=time){i=n;break}
  
  if(i<0){
    ctx.fillStyle='#0f172a';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    return;
  }
  
  if(i>=0){
    const cp=photos[i],np=photos[i+1];
    const photoDuration=np?np.startTime-cp.startTime:PHOTO_DURATION;
    const timeInPhoto=time-cp.startTime;
    const progress=Math.min(1,timeInPhoto/photoDuration);
    
    if(cp.imgObj&&cp.imgObj.complete){
      const blurred=createBlurredBackground(cp.imgObj);
      ctx.putImageData(blurred,0,0);
    }
    
    let alpha=1;
    const fadeOutStart=0.7;
    if(progress>fadeOutStart){
      alpha=Math.max(0,1-(progress-fadeOutStart)/(1-fadeOutStart));
    }
    drawPhotoZoom(cp,alpha,progress);
    
    if(np&&alpha<1){
      const fadeInStart=0;
      const npAlpha=Math.max(0,Math.min(1,(progress-fadeInStart)*2));
      drawPhotoZoom(np,npAlpha,0);
    }
  }
}

function drawPhoto(p,scale,alpha){
  const w=canvas.width,h=canvas.height,img=p.imgObj;
  if(!img||!img.complete)return;
  ctx.save();
  ctx.globalAlpha=alpha;
  const ia=img.width/img.height,ca=w/h;
  const photoW=ia>ca?h*ia:w;
  const photoH=ia>ca?h:w/ia;
  const photoX=(w-photoW)/2;
  const photoY=(h-photoH)/2;
  ctx.drawImage(img,photoX,photoY,photoW,photoH);
  ctx.restore();
}

function drawPhotoZoom(p,alpha,progress){
  const w=canvas.width,h=canvas.height,img=p.imgObj;
  if(!img||!img.complete)return;
  
  ctx.save();
  ctx.globalAlpha=alpha;
  
  const ia=img.width/img.height,ca=w/h;
  let photoW=ia>ca?h*ia:w;
  let photoH=ia>ca?h:w/ia;
  
  const scale=1+progress*0.15;
  photoW*=scale;
  photoH*=scale;
  
  const photoX=(w-photoW)/2;
  const photoY=(h-photoH)/2;
  
  ctx.drawImage(img,photoX,photoY,photoW,photoH);
  ctx.restore();
}

async function startVideoGeneration(){
  if(!audioElement.src||!photos.length){alert('Unggah audio dan foto terlebih dahulu.');return}
  if(!canvas.captureStream||!window.MediaRecorder){alert('Browser ini tidak mendukung export video.');return}
  
  $('exportModal').classList.remove('hidden');
  $('exportModal').classList.add('flex');
  
  try{
    const stream=canvas.captureStream(30);
    const audioTrack=audioElement.captureStream().getAudioTracks()[0];
    stream.addTrack(audioTrack);
    
    const recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9,opus'});
    const chunks=[];
    recorder.ondataavailable=e=>chunks.push(e.data);
    
    const startTime=Date.now(),duration=totalAudioDuration*1000;
    recorder.start();
    await audioElement.play();
    
    const updateProgress=()=>{
      const elapsed=Date.now()-startTime;
      const pct=Math.min(100,Math.round(elapsed/duration*100));
      $('exportProgress').style.width=pct+'%';
      $('exportStatusText').textContent=`${pct}%`;
      if(elapsed<duration)setTimeout(updateProgress,100);
    };
    updateProgress();
    
    await new Promise(res=>setTimeout(res,duration+500));
    recorder.stop();
    audioElement.pause();
    audioElement.currentTime=0;
    
    await new Promise(res=>recorder.onstop=res);
    const blob=new Blob(chunks,{type:'video/webm'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='fotovibe-'+Date.now()+'.webm';
    a.click();
    URL.revokeObjectURL(url);
    
    setTimeout(closeExportModal,1000);
  }catch(err){
    console.error('Export error:',err);
    alert('Error: '+err.message);
    closeExportModal();
  }
}

function closeExportModal(){
  $('exportModal').classList.add('hidden');
  $('exportModal').classList.remove('flex');
}

window.addEventListener('resize',updateCanvasDimensions);
