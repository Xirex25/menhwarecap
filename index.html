<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FotoVibe Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{500:'#6366f1',600:'#4f46e5'}}}}}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:Inter,sans-serif}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:#0f172a}::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}input[type=range]{accent-color:#6366f1}</style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
<header class="border-b border-slate-800 bg-slate-900/90 px-4 sm:px-6 py-3 flex flex-wrap gap-3 items-center justify-between sticky top-0 z-40">
  <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center"><i class="fa-solid fa-photo-film"></i></div><div><h1 class="font-bold text-lg">FotoVibe</h1><p class="text-xs text-slate-400">Foto + Musik</p></div></div>
  <div class="flex items-center gap-3 flex-wrap"><div class="flex bg-slate-800 p-1 rounded-lg border border-slate-700"><button id="ratio169" onclick="setAspectRatio('16:9')" class="ratio px-3 py-1.5 rounded-md text-xs font-semibold text-slate-100 bg-indigo-600">16:9</button><button id="ratio916" onclick="setAspectRatio('9:16')" class="ratio px-3 py-1.5 rounded-md text-xs text-slate-400">9:16</button><button id="ratio11" onclick="setAspectRatio('1:1')" class="ratio px-3 py-1.5 rounded-md text-xs text-slate-400">1:1</button></div><button onclick="$('audioMultiInput').click()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-semibold"><i class="fa-solid fa-music mr-2"></i>Musik</button><button onclick="$('photosInput').click()" class="px-4 py-2 bg-violet-600 hover:bg-violet-500 rounded-lg text-sm font-semibold"><i class="fa-solid fa-image mr-2"></i>Foto</button><button onclick="startVideoGeneration()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-sm font-semibold"><i class="fa-solid fa-download mr-2"></i>Export</button></div>
</header>
<main class="max-w-[1700px] mx-auto w-full p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-5">
<section class="lg:col-span-7 space-y-4"><div class="bg-slate-900 border border-slate-800 rounded-2xl p-4"><div id="canvasWrapper" class="relative h-[min(55vw,440px)] min-h-[280px] bg-slate-950 rounded-xl overflow-hidden"><canvas id="videoCanvas" class="w-full h-full"></canvas><div id="emptyCanvasNotice" class="absolute inset-0 flex items-center justify-center text-slate-400"><div class="text-center"><i class="fa-solid fa-image text-4xl mb-3"></i><p>Belum ada foto</p></div></div></div></div><div class="bg-slate-900 border border-slate-800 rounded-2xl p-5"><div class="flex justify-between items-center pb-3 border-b border-slate-800"><div><h2 class="font-semibold text-sm"><i class="fa-solid fa-timeline mr-2 text-indigo-400"></i>Timeline</h2></div></div><div class="relative h-16 bg-slate-950 rounded-lg overflow-hidden"><div id="timelineVisualiser" class="absolute inset-0 flex items-end gap-0.5 p-2"></div><div id="timelineMarkersTrack" class="absolute inset-0"></div></div><div class="flex gap-2 mt-3"><input id="seekSlider" type="range" min="0" max="100" value="0" oninput="onSeekInput(this.value)" class="flex-1 h-2 rounded-lg bg-slate-800 appearance-none cursor-pointer"><button onclick="togglePlay()" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg"><i id="playIcon" class="fa-solid fa-play"></i></button></div><div class="flex justify-between text-xs text-slate-400 mt-2"><span id="currentTimeDisplay">00:00</span><span id="durationTimeDisplay">00:00</span></div></div></section>
<section class="lg:col-span-5 space-y-4"><div class="bg-slate-900 border border-slate-800 rounded-2xl p-5"><div class="flex justify-between border-b border-slate-800 pb-3"><div><h2 class="font-semibold text-sm"><i class="fa-solid fa-compact-disc mr-2 text-indigo-400"></i>Musik</h2><p id="audioCountBadge" class="text-xs text-slate-400">0 Lagu</p></div></div><div id="audioMergeStatus" class="hidden mb-3 p-3 bg-slate-800 rounded text-xs"><div class="flex gap-2 items-center"><i class="fa-solid fa-spinner animate-spin"></i><span id="audioMergeStatusText">Memproses...</span></div><div class="w-full bg-slate-700 rounded-full h-1 mt-2"><div id="audioMergeProgress" class="bg-indigo-500 h-1 rounded-full transition-all" style="width:0%"></div></div></div><div id="audioPlaylist" class="space-y-2 max-h-48 overflow-y-auto"></div><div class="mt-3 p-2 bg-slate-800 rounded text-xs"><div><span class="text-slate-400">Total durasi:</span> <span id="totalAudioDurationDisplay" class="font-semibold">00:00</span></div></div></div><div class="bg-slate-900 border border-slate-800 rounded-2xl p-5"><div class="flex justify-between border-b border-slate-800 pb-3"><div><h2 class="font-semibold text-sm"><i class="fa-solid fa-images mr-2 text-violet-400"></i>Foto</h2><p id="photoCountBadge" class="text-xs text-slate-400">0 Foto</p></div></div><div id="photosList" class="space-y-2 max-h-48 overflow-y-auto"></div><div class="mt-3"><button onclick="addPhotoAtCurrentTime()" class="w-full px-3 py-2 bg-slate-800 hover:bg-slate-700 text-sm rounded-lg"><i class="fa-solid fa-plus mr-2"></i>Tambah di waktu ini</button></div></div></section>
</main>
<div id="exportModal" class="fixed inset-0 hidden items-center justify-center bg-black/80 z-50 p-4"><div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-md w-full"><div class="flex justify-between items-center mb-4"><h3 class="font-semibold">Export Video</h3><button onclick="closeExportModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button></div><div id="exportStatus" class="text-sm text-slate-300"><div class="flex gap-2 items-center"><i class="fa-solid fa-spinner animate-spin"></i>Mengekspor video...</div><div class="w-full bg-slate-700 rounded-full h-2 mt-3"><div id="exportProgress" class="bg-emerald-500 h-2 rounded-full" style="width:0%"></div></div><p id="exportStatusText" class="mt-2 text-xs text-slate-400">Persiapan...</p></div></div></div>
<input type="file" id="audioMultiInput" accept="audio/*" multiple class="hidden">
<input type="file" id="photosInput" accept="image/*" multiple class="hidden">
<audio id="audioPlayer" class="hidden" crossorigin="anonymous"></audio>
<script>
'use strict';
const $=id=>document.getElementById(id);
const audioElement=$('audioPlayer'),canvas=$('videoCanvas'),ctx=canvas.getContext('2d');
let audioTracks=[],photos=[],selectedPhotoId=null,totalAudioDuration=0,isPlaying=false,isMergingAudio=false,aspect='16:9',audioCtx=null;

const formatTime=s=>{s=Number(s)||0;return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')};

function setAspectRatio(r){
  aspect=r;
  document.querySelectorAll('.ratio').forEach(b=>b.className='ratio px-3 py-1.5 rounded-md text-xs text-slate-400');
  $('ratio'+({'16:9':'169','9:16':'916','1:1':'11'}[r])).className='ratio px-3 py-1.5 rounded-md text-xs font-semibold text-slate-100 bg-indigo-600';
  updateCanvasDimensions();
}

function updateCanvasDimensions(){
  const[w,h]=aspect.split(':').map(Number),max=960;
  canvas.width=w>h?max:Math.round(max*w/h);
  canvas.height=w>h?Math.round(max*h/w):max;
  renderCanvasFrame(audioElement.currentTime||0);
}

function updatePlaybackUI(){
  const t=audioElement.currentTime||0;
  $('currentTimeDisplay').textContent=formatTime(t);
  $('durationTimeDisplay').textContent=formatTime(totalAudioDuration);
  $('seekSlider').max=Math.max(100,totalAudioDuration||100);
  $('seekSlider').value=t;
}

function togglePlay(){
  if(!audioElement.src||isMergingAudio)return;
  audioElement.paused?audioElement.play().catch(e=>console.warn(e)):audioElement.pause();
}

function stopPlayback(){
  audioElement.pause();
  audioElement.currentTime=0;
  renderCanvasFrame(0);
  updatePlaybackUI();
}

audioElement.onplay=()=>{
  isPlaying=true;
  $('playIcon').className='fa-solid fa-pause';
  requestAnimationFrame(playbackLoop);
};
audioElement.onpause=()=>{
  isPlaying=false;
  $('playIcon').className='fa-solid fa-play';
};
audioElement.ontimeupdate=updatePlaybackUI;

function onSeekInput(v){
  audioElement.currentTime=Number(v);
  renderCanvasFrame(Number(v));
}

function playbackLoop(){
  if(isPlaying){
    renderCanvasFrame(audioElement.currentTime);
    requestAnimationFrame(playbackLoop);
  }
}

$('audioMultiInput').onchange=e=>handleMultiAudioUpload(e);
$('photosInput').onchange=e=>handlePhotosUpload(e);

async function handleMultiAudioUpload(e){
  const files=[...e.target.files];
  if(!files.length)return;
  
  audioTracks=[];
  isMergingAudio=true;
  $('audioMergeStatus').classList.remove('hidden');
  $('audioMergeStatusText').textContent='Memuat audio...';
  $('audioMergeProgress').style.width='0%';
  
  try{
    let loadedCount=0;
    
    for(let i=0;i<files.length;i++){
      try{
        const file=files[i];
        console.log('Loading:',file.name,file.type,file.size);
        
        const buffer=await decodeAudioFile(file);
        if(!buffer){
          console.warn('Skip:',file.name,'- Buffer invalid');
          continue;
        }
        
        audioTracks.push({name:file.name,buffer});
        loadedCount++;
        
        const progress=Math.round(loadedCount/files.length*100);
        $('audioMergeProgress').style.width=progress+'%';
        $('audioMergeStatusText').textContent=`Memuat ${loadedCount}/${files.length} file...`;
      }catch(err){
        console.error('Error loading '+files[i].name+':',err);
      }
    }
    
    if(!audioTracks.length){
      throw new Error('Tidak ada file audio yang berhasil dimuat');
    }
    
    $('audioMergeStatusText').textContent='Menggabungkan audio...';
    await new Promise(r=>setTimeout(r,100));
    await mergeAudioTracks();
    
    $('audioMergeStatus').classList.add('hidden');
    renderAudioUI();
    console.log('✓ Audio loading success');
  }catch(err){
    console.error('❌ Audio error:',err);
    alert('Error: '+err.message);
    audioTracks=[];
    isMergingAudio=false;
    $('audioMergeStatus').classList.add('hidden');
    renderAudioUI();
  }
}

async function decodeAudioFile(file){
  if(!audioCtx){
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  }
  
  try{
    const arrayBuffer=await file.arrayBuffer();
    if(!arrayBuffer||arrayBuffer.byteLength===0){
      throw new Error('File kosong');
    }
    
    const audioBuffer=await new Promise((resolve,reject)=>{
      audioCtx.decodeAudioData(arrayBuffer,resolve,reject);
    });
    
    return audioBuffer;
  }catch(e){
    console.warn('Fallback to audio element for:',file.name);
    return null;
  }
}

async function mergeAudioTracks(){
  if(!audioTracks.length)return;
  
  try{
    if(!audioCtx){
      audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    }
    
    const rate=audioCtx.sampleRate;
    const channels=Math.max(...audioTracks.map(t=>t.buffer.numberOfChannels));
    const total=audioTracks.reduce((n,t)=>n+t.buffer.length,0);
    const merged=audioCtx.createBuffer(channels,total,rate);
    
    let offset=0;
    for(let track of audioTracks){
      const trackChannels=track.buffer.numberOfChannels;
      const trackLength=track.buffer.length;
      
      for(let c=0;c<channels;c++){
        const sourceData=c<trackChannels?track.buffer.getChannelData(c):new Float32Array(trackLength);
        merged.getChannelData(c).set(sourceData,offset);
      }
      offset+=trackLength;
    }
    
    totalAudioDuration=total/rate;
    autoDistributePhotos();
    
    const wavData=audioBufferToWav(merged);
    const blob=new Blob([wavData],{type:'audio/wav'});
    audioElement.src=URL.createObjectURL(blob);
    updatePlaybackUI();
    isMergingAudio=false;
  }catch(err){
    console.error('Merge error:',err);
    throw err;
  }
}

function audioBufferToWav(audioBuffer){
  const rate=audioBuffer.sampleRate||44100;
  const channels=audioBuffer.numberOfChannels;
  const length=audioBuffer.length;
  const bytesPerSample=2;
  const frameSize=channels*bytesPerSample;
  const dataSize=length*frameSize;
  const bufferSize=44+dataSize;
  
  const buffer=new ArrayBuffer(bufferSize);
  const view=new DataView(buffer);
  
  const writeString=(offset,string)=>{
    for(let i=0;i<string.length;i++){
      view.setUint8(offset+i,string.charCodeAt(i));
    }
  };
  
  try{
    writeString(0,'RIFF');
    view.setUint32(4,bufferSize-8,true);
    writeString(8,'WAVE');
    
    writeString(12,'fmt ');
    view.setUint32(16,16,true);
    view.setUint16(20,1,true);
    view.setUint16(22,channels,true);
    view.setUint32(24,rate,true);
    view.setUint32(28,rate*frameSize,true);
    view.setUint16(32,frameSize,true);
    view.setUint16(34,16,true);
    
    writeString(36,'data');
    view.setUint32(40,dataSize,true);
    
    const channelData=[];
    for(let c=0;c<channels;c++){
      channelData.push(audioBuffer.getChannelData(c));
    }
    
    let sampleOffset=44;
    for(let i=0;i<length;i++){
      for(let c=0;c<channels;c++){
        const sample=Math.max(-1,Math.min(1,channelData[c][i]));
        const intSample=sample<0?sample*0x8000:sample*0x7fff;
        if(sampleOffset+1<bufferSize){
          view.setInt16(sampleOffset,intSample,true);
          sampleOffset+=2;
        }
      }
    }
    
    return buffer;
  }catch(err){
    console.error('WAV encoding error:',err,'buffer size:',bufferSize,'data size:',dataSize);
    throw err;
  }
}

function renderAudioUI(){
  $('audioCountBadge').textContent=audioTracks.length+' Lagu';
  $('totalAudioDurationDisplay').textContent=formatTime(totalAudioDuration);
  $('audioPlaylist').innerHTML=audioTracks.map((t,i)=>`<div class="flex justify-between items-center p-2 bg-slate-800 rounded text-sm"><span class="truncate">${escapeHtml(t.name)}</span><button onclick="removeAudio(${i})" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-trash"></i></button></div>`).join('');
  renderTimelineMarkers();
}

function removeAudio(i){
  audioTracks.splice(i,1);
  if(audioTracks.length)mergeAudioTracks().then(renderAudioUI);
  else{audioElement.removeAttribute('src');totalAudioDuration=0;renderAudioUI();updatePlaybackUI();selectedPhotoId=null;updatePhotosUI()}
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function handlePhotosUpload(e){
  for(const file of e.target.files){
    const url=URL.createObjectURL(file),img=new Image();
    await new Promise(res=>{img.onload=res;img.onerror=res;img.src=url});
    if(img.naturalWidth){
      photos.push({id:Date.now()+Math.random(),url,imgObj:img,startTime:0});
    }
  }
  autoDistributePhotos();
}

function autoDistributePhotos(){
  if(!photos.length){updatePhotosUI();return}
  const interval=(totalAudioDuration||30)/photos.length;
  photos.forEach((p,i)=>p.startTime=Number((i*interval).toFixed(1)));
  updatePhotosUI();
}

function updatePhotoTime(id,v){
  const p=photos.find(x=>x.id==id);
  if(p)p.startTime=Math.max(0,Number(v)||0);
  photos.sort((a,b)=>a.startTime-b.startTime);
  updatePhotosUI();
  renderCanvasFrame(audioElement.currentTime||0);
}

function deletePhoto(id){
  const p=photos.find(x=>x.id==id);
  if(p)URL.revokeObjectURL(p.url);
  photos=photos.filter(x=>x.id!=id);
  if(selectedPhotoId==id)selectedPhotoId=photos[0]?.id||null;
  updatePhotosUI();
  renderCanvasFrame(audioElement.currentTime||0);
}

function addPhotoAtCurrentTime(){
  if(!selectedPhotoId&&photos[0])selectedPhotoId=photos[0].id;
  if(selectedPhotoId)updatePhotoTime(selectedPhotoId,audioElement.currentTime)
}

function updatePhotosUI(){
  $('photoCountBadge').textContent=photos.length+' Foto';
  $('emptyCanvasNotice').style.display=photos.length?'none':'flex';
  $('photosList').innerHTML=photos.length?photos.map((p,i)=>`<div class="p-2 bg-slate-800 rounded"><div class="flex gap-2 mb-1"><div class="w-12 h-12 rounded bg-slate-700 overflow-hidden flex-shrink-0"><img src="${p.url}" class="w-full h-full object-cover"></div><div class="flex-1"><div class="text-xs text-slate-400">Waktu</div><input type="number" value="${p.startTime}" min="0" step="0.1" onchange="updatePhotoTime(${p.id},this.value)" class="w-full px-2 py-1 bg-slate-900 border border-slate-700 rounded text-xs text-slate-100"></div><button onclick="deletePhoto(${p.id})" class="text-red-400 hover:text-red-300 px-2"><i class="fa-solid fa-trash"></i></button></div></div>`).join(''):'<p class="text-slate-400 text-sm">Tidak ada foto</p>';
  renderTimelineMarkers();
  renderCanvasFrame(audioElement.currentTime||0);
}

function renderTimelineMarkers(){
  const t=$('timelineMarkersTrack');
  t.innerHTML='';
  photos.forEach(p=>{
    if(totalAudioDuration){
      const x=document.createElement('i');
      x.className='absolute top-0 bottom-0 w-0.5 bg-violet-500 opacity-70';
      x.style.left=(p.startTime/totalAudioDuration*100)+'%';
      t.appendChild(x);
    }
  });
}

function generateVisualiserBars(){
  const el=$('timelineVisualiser');
  el.innerHTML=Array.from({length:45},()=>`<i class="flex-1 bg-indigo-500 rounded" style="height:${20+Math.random()*70}%"></i>`).join('');
}

function renderCanvasFrame(time){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!photos.length)return;
  let i=photos.findLastIndex?photos.findLastIndex(p=>p.startTime<=time):-1;
  if(i<0)for(let n=photos.length-1;n>=0;n--)if(photos[n].startTime<=time){i=n;break}
  if(i>=0){
    const cp=photos[i],np=photos[i+1];
    let alpha=1;
    if(np){
      const gap=np.startTime-cp.startTime;
      alpha=Math.max(0,1-(time-cp.startTime)/(gap*0.7));
    }
    drawPhoto(cp,1,alpha);
    if(np&&alpha<1)drawPhoto(np,1,1-alpha);
  }
}

function drawPhoto(p,scale,alpha){
  const w=canvas.width,h=canvas.height,img=p.imgObj;
  if(!img||!img.complete)return;
  ctx.save();
  ctx.globalAlpha=alpha;
  const ia=img.width/img.height,ca=w/h,bgW=ia>ca?h*ia:w,bgH=ia>ca?h:w/ia,x=(w-bgW)/2,y=(h-bgH)/2;
  ctx.drawImage(img,x,y,bgW,bgH);
  ctx.restore();
}

async function startVideoGeneration(){
  if(!audioElement.src||!photos.length){alert('Unggah audio dan foto terlebih dahulu.');return}
  if(!canvas.captureStream||!window.MediaRecorder){alert('Browser ini tidak mendukung export video.');return}
  
  $('exportModal').classList.remove('hidden');
  $('exportModal').classList.add('flex');
  
  try{
    const stream=canvas.captureStream(30);
    const audioTrack=audioElement.captureStream().getAudioTracks()[0];
    stream.addTrack(audioTrack);
    
    const recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9,opus'});
    const chunks=[];
    recorder.ondataavailable=e=>chunks.push(e.data);
    
    const startTime=Date.now(),duration=totalAudioDuration*1000;
    recorder.start();
    await audioElement.play();
    
    const updateProgress=()=>{
      const elapsed=Date.now()-startTime;
      const pct=Math.min(100,Math.round(elapsed/duration*100));
      $('exportProgress').style.width=pct+'%';
      $('exportStatusText').textContent=`${pct}%`;
      if(elapsed<duration)setTimeout(updateProgress,100);
    };
    updateProgress();
    
    await new Promise(res=>setTimeout(res,duration+500));
    recorder.stop();
    audioElement.pause();
    audioElement.currentTime=0;
    
    await new Promise(res=>recorder.onstop=res);
    const blob=new Blob(chunks,{type:'video/webm'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='fotovibe-'+Date.now()+'.webm';
    a.click();
    URL.revokeObjectURL(url);
    
    setTimeout(closeExportModal,1000);
  }catch(err){
    console.error('Export error:',err);
    alert('Error: '+err.message);
    closeExportModal();
  }
}

function closeExportModal(){
  $('exportModal').classList.add('hidden');
  $('exportModal').classList.remove('flex');
}

window.addEventListener('load',()=>{updateCanvasDimensions();updatePhotosUI();generateVisualiserBars()});
window.addEventListener('resize',updateCanvasDimensions);
</script></body></html>
